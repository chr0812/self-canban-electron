" stroke="#2A1B14" stroke-width="1.3" stroke-linecap="round"><ellipse cx="7" cy="8.6" rx="3.3" ry="4.4" fill="#2A1B14" fill-opacity=".28"/><circle cx="7" cy="3.4" r="1.9"/><path d="M3.7 6.2L1 4.8M3.6 8.6H0.8M3.8 11L1.2 12.6M10.3 6.2L13 4.8M10.4 8.6H13.2M10.2 11L12.8 12.6"/></g></g><text x="254" y="226" font-size="14" font-weight="700" fill="#2A1B14">개발 버그</text><g transform="translate(346 215)"><g fill="none" stroke="#5C4538" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="12" height="12" rx="2"/><path d="M4 7.4L6.2 9.6L10 4.8"/></g></g><text x="366" y="226" font-size="14" font-weight="500" fill="#5C4538">할 일</text><text x="464" y="196" font-size="12" font-weight="700" fill="#735B4D">상태</text><rect x="464" y="204" width="200" height="34" rx="4" fill="#FAF3EE" stroke="#78604F" stroke-width="1"/><text x="476" y="226" font-size="14" font-weight="700" fill="#A63F0E">진행 중</text><path d="M640 217L646 223L652 217" fill="none" stroke="#5C4538" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="224" y="262" font-size="12" font-weight="700" fill="#735B4D">마감일</text><text x="264" y="262" font-size="12" font-weight="400" fill="#735B4D">선택, YYYY-MM-DD</text><rect x="224" y="270" width="220" height="34" rx="4" fill="#FAF3EE" stroke="#2A1B14" stroke-width="2"/><text x="236" y="292" font-size="14" font-weight="400" fill="#2A1B14">2026-11-31</text><g transform="translate(224 310)"><g fill="none" stroke="#2A1B14" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="6"/><path d="M7 3.8V7.6"/></g><circle cx="7" cy="10" r="0.9" fill="#2A1B14"/></g><text x="246" y="322" font-size="14" font-weight="400" fill="#2A1B14">존재하지 않는 날짜입니다. 2026-11-06 형식으로 입력하세요</text><text x="464" y="262" font-size="12" font-weight="700" fill="#735B4D">우선순위</text><rect x="464" y="270" width="200" height="34" rx="4" fill="none" stroke="#78604F" stroke-width="1"/><text x="489" y="292" font-size="14" font-weight="500" fill="#5C4538" text-anchor="middle">없음</text><rect x="515" y="271" width="49" height="32" rx="3" fill="#FFE6D8" stroke="#B54A12" stroke-width="1"/><text x="539" y="292" font-size="14" font-weight="700" fill="#2A1B14" text-anchor="middle">높음</text><text x="589" y="292" font-size="14" font-weight="500" fill="#5C4538" text-anchor="middle">보통</text><text x="639" y="292" font-size="14" font-weight="500" fill="#5C4538" text-anchor="middle">낮음</text><text x="224" y="346" font-size="12" font-weight="700" fill="#735B4D">상세 설명</text><rect x="224" y="354" width="440" height="100" rx="4" fill="#FAF3EE" stroke="#78604F" stroke-width="1"/><text x="236" y="378" font-size="14" font-weight="400" fill="#5C4538">저장 중 디스크가 가득 찬 경우 문구가 사라지는지 확인한다.</text><text x="224" y="478" font-size="12" font-weight="700" fill="#735B4D">추가 메모</text><rect x="224" y="486" width="440" height="80" rx="4" fill="#FAF3EE" stroke="#78604F" stroke-width="1"/><text x="236" y="510" font-size="14" font-weight="400" fill="#5C4538">재현 절차는 진행 기록 첫 줄에 적어 둠</text><text x="224" y="604" font-size="12" font-weight="400" fill="#735B4D">필수 입력은 제목 하나. 상태는 칸 이동과 같은 값(할 일, 진행 중, 완료)</text><text x="716" y="108" font-size="16" font-weight="700" fill="#2A1B14">진행 기록</text><text x="790" y="108" font-size="14" font-weight="500" fill="#735B4D">3건</text><text x="716" y="140" font-size="14" font-weight="500" fill="#735B4D">11/01 10:20</text><rect x="820.5" y="126.5" width="42" height="19" rx="3" fill="none" stroke="#E5C77C" stroke-width="1"/><text x="828" y="140" font-size="12" font-weight="700" fill="#7A5000">할 일</text><text x="716" y="164" font-size="14" font-weight="400" fill="#2A1B14">재현 조건 정리. 마감일 칸 입력에서만 </text><text x="716" y="184" font-size="14" font-weight="400" fill="#2A1B14">발생함.</text><rect x="716" y="196" width="340" height="1" fill="#E3CFC3"/><text x="716" y="224" font-size="14" font-weight="500" fill="#735B4D">11/02 16:05</text><rect x="820.5" y="210.5" width="54" height="19" rx="3" fill="none" stroke="#EDB291" stroke-width="1"/><text x="828" y="224" font-size="12" font-weight="700" fill="#A63F0E">진행 중</text><text x="716" y="248" font-size="14" font-weight="400" fill="#2A1B14">원인 후보 두 개. 저장 직후 상태 갱신</text><text x="716" y="268" font-size="14" font-weight="400" fill="#2A1B14"> 순서 확인 필요.</text><rect x="716" y="280" width="340" height="1" fill="#E3CFC3"/><text x="716" y="308" font-size="14" font-weight="500" fill="#735B4D">11/03 09:40</text><rect x="820.5" y="294.5" width="54" height="19" rx="3" fill="none" stroke="#EDB291" stroke-width="1"/><text x="828" y="308" font-size="12" font-weight="700" fill="#A63F0E">진행 중</text><text x="716" y="332" font-size="14" font-weight="400" fill="#2A1B14">갱신 순서 수정본 시험 중. 보드 이동은</text><text x="716" y="352" font-size="14" font-weight="400" fill="#2A1B14"> 정상.</text><rect x="716" y="364" width="340" height="1" fill="#E3CFC3"/><text x="716" y="400" font-size="12" font-weight="400" fill="#735B4D">남긴 순서대로 아래로 쌓이고 새 기록이 맨 아래</text><text x="716" y="490" font-size="12" font-weight="700" fill="#735B4D">기록 내용</text><rect x="716" y="498" width="340" height="58" rx="4" fill="#FAF3EE" stroke="#78604F" stroke-width="1"/><text x="716" y="588" font-size="14" font-weight="400" fill="#5C4538">기록에 붙는 상태: 진행 중</text><rect x="960" y="568" width="96" height="30" rx="4" fill="none" stroke="#78604F" stroke-width="1"/><text x="1008" y="588" font-size="14" font-weight="700" fill="#5C4538" text-anchor="middle">기록 추가</text><rect x="200" y="644" width="880" height="1" fill="#E3CFC3"/><rect x="224" y="660" width="84" height="36" rx="4" fill="none" stroke="#78604F" stroke-width="1"/><g transform="translate(236 671)"><g fill="none" stroke="#5C4538" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5H12.5M5 3.5V1.8H9V3.5M3 3.5L3.6 12.2H10.4L11 3.5M5.6 6V10M8.4 6V10"/></g></g><text x="256" y="683" font-size="14" font-weight="700" fill="#5C4538">삭제</text><rect x="872" y="660" width="72" height="36" rx="4" fill="none" stroke="#78604F" stroke-width="1"/><text x="908" y="683" font-size="14" font-weight="700" fill="#5C4538" text-anchor="middle">취소</text><rect x="952" y="660" width="104" height="36" rx="4" fill="#B54A12"/><text x="1004" y="683" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">저장</text><rect x="200" y="716" width="880" height="64" rx="4" fill="#FFFFFF" stroke="#B89C8B" stroke-width="1" stroke-dasharray="5 4"/><text x="224" y="734" font-size="12" font-weight="400" fill="#735B4D">삭제를 누르면 하단 줄이 아래 모양으로 바뀜 (삭제 확인 단계, 처음 포커스는 취소)</text><g transform="translate(224 748)"><g fill="none" stroke="#2A1B14" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="6"/><path d="M7 3.8V7.6"/></g><circle cx="7" cy="10" r="0.9" fill="#2A1B14"/></g><text x="246" y="761" font-size="14" font-weight="400" fill="#2A1B14">이 카드와 진행 기록 3건이 삭제됩니다. 되돌릴 수 없습니다.</text><rect x="872" y="746" width="72" height="28" rx="4" fill="none" stroke="#78604F" stroke-width="1"/><text x="908" y="765" font-size="14" font-weight="700" fill="#5C4538" text-anchor="middle">취소</text><rect x="952" y="746" width="104" height="28" rx="4" fill="#B54A12"/><text x="1004" y="765" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">삭제 확인</text></g>
