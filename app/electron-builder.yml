# 포장 설정 (docs/05-design/06-file-map.md `electron-builder.yml`, 05-architecture.md 퓨즈).
# - Windows 실행 폴더(`npm run package` = electron-builder --win --dir). 결과는 release/ (버전 관리 제외).
# - 배포·자동 업데이트를 하지 않는다: `publish` 설정이 없다. 앱 코드에도 autoUpdater 가 없다 (NFR-001).
# - 코드 서명을 하지 않는다 (서명 인증서·서명 도구를 쓰지 않는다).
# - 앱 아이콘 파일은 계획에 없다 (결정 필요 7). 기본 Electron 아이콘이 쓰인다.
# - 표시 이름은 package.json 의 productName 과 같다. 데이터 폴더 이름(APP_DATA_FOLDER)과는 분리된 값이다 (ADR-012).

appId: self-canban
productName: 일정관리
directories:
  output: release
files:
  - out/**
  - package.json
# 글꼴 라이선스 원문(SIL OFL 1.1)을 포장 앱의 resources/licenses/ 아래에 둔다.
# OFL 은 글꼴을 소프트웨어와 함께 배포할 때 저작권·라이선스 문구를 함께 두라고 한다 (NFR-001, TC-133).
# extraResources 는 asar 밖 resources 폴더로 그대로 복사되므로 파일 탐색기에서 바로 찾을 수 있다.
extraResources:
  - from: src/renderer/src/styles/fonts/SUIT-LICENSE.txt
    to: licenses/SUIT-LICENSE.txt
asar: true
npmRebuild: false
win:
  target:
    - target: dir
      arch: x64
  signAndEditExecutable: false
  forceCodeSigning: false

# 포장한 실행에서만 끄는 퓨즈. 개발 실행과 화면 시험은 포장 전의 out/ 을 쓰므로 영향이 없고
# Playwright 가 요구하는 EnableNodeCliInspectArguments 와 충돌하지 않는다 (RK-008).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
