<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="ttl dsc">
<title id="ttl">SCR-004 보관함 와이어프레임 (어두운 판으로 그림, 따뜻한 색 체계)</title>
<desc id="dsc">보관한 카드 목록(행마다 삭제 버튼), 삭제 확인 상태 예시, 검색과 필터(종류와 우선순위 목록 맨 위에 전체), 보드로 돌아가기를 그린 저충실도 와이어프레임. 어두운 판으로 그린 것이며 처음 열리는 기본은 밝은 판이다. 창 안쪽 1280x860 기준</desc>
