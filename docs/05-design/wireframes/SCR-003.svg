<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="ttl dsc">
<title id="ttl">SCR-003 캘린더 와이어프레임 (어두운 판으로 그림, 따뜻한 색 체계, 월 보기, 칩 끌기 중)</title>
<desc id="dsc">2026년 11월 월간 캘린더. 날짜 칸마다 카드 칩이 들어가고 월과 주 보기를 고르며, 칩을 다른 날짜 칸으로 끄는 중의 표시(끌리는 칩은 흐림, 놓을 수 있는 칸은 점선 윤곽)를 그린 저충실도 와이어프레임. 5주인 달이 창 안쪽 1280x860(기본 창 높이 920 기준)에서 스크롤 없이 모두 보인다. 어두운 판으로 그린 것이며 처음 열리는 기본은 밝은 판이다</desc>
