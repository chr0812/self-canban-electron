<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="ttl dsc">
<title id="ttl">SCR-002 카드 입력·상세 와이어프레임 (밝은 판, 따뜻한 색 체계)</title>
