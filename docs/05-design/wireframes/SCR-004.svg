00" fill="#D6C6B9">보관한 카드 3건 · 보기만 할 수 있습니다</text><rect x="224" y="100" width="1040" height="32" fill="#16100D"/><rect x="224" y="131" width="1040" height="1" fill="#7A6252"/><text x="240" y="121" font-size="12" font-weight="700" fill="#AB9A8D">제목</text><text x="700" y="121" font-size="12" font-weight="700" fill="#AB9A8D">종류</text><text x="810" y="121" font-size="12" font-weight="700" fill="#AB9A8D">마감</text><text x="920" y="121" font-size="12" font-weight="700" fill="#AB9A8D">우선순위</text><text x="1070" y="121" font-size="12" font-weight="700" fill="#AB9A8D">보관한 날</text><g transform="translate(240 147)"><g fill="none" stroke="#8DB36B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="12" height="12" rx="2"/><path d="M4 7.4L6.2 9.6L10 4.8"/></g></g><text x="264" y="159" font-size="14" font-weight="600" fill="#F6EDE6">10월 정기 점검 보고서</text><rect x="700.5" y="144.5" width="41" height="19" rx="3" fill="none" stroke="#7A6252" stroke-width="1"/><text x="707" y="158" font-size="12" font-weight="700" fill="#D6C6B9">할 일</text><text x="810" y="159" font-size="14" font-weight="500" fill="#D6C6B9">마감 10/30</text><rect x="920" y="154" width="3" height="5" rx="0.5" fill="#D6C6B9"/><rect x="924.5" y="151" width="3" height="8" rx="0.5" fill="#D6C6B9"/><rect x="929" y="148" width="3" height="11" rx="0.5" fill="#7A6252"/><text x="940" y="159" font-size="14" font-weight="500" fill="#D6C6B9">중간</text><text x="1070" y="159" font-size="14" font-weight="500" fill="#D6C6B9">11/01</text><rect x="1140.5" y="142.5" width="63" height="23" rx="3" fill="none" stroke="#B09A88" stroke-width="1"/><text x="1172" y="158" font-size="12" font-weight="700" fill="#D6C6B9" text-anchor="middle">삭제</text><g transform="translate(1240 147)"><path d="M5 2L10 7L5 12" fill="none" stroke="#AB9A8D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="224" y="175" width="1040" height="1" fill="#43352B"/><g transform="translate(240 191)"><g fill="none" stroke="#8DB36B" stroke-width="1.3" stroke-linecap="round"><ellipse cx="7" cy="8.6" rx="3.3" ry="4.4" fill="#8DB36B" fill-opacity=".28"/><circle cx="7" cy="3.4" r="1.9"/><path d="M3.7 6.2L1 4.8M3.6 8.6H0.8M3.8 11L1.2 12.6M10.3 6.2L13 4.8M10.4 8.6H13.2M10.2 11L12.8 12.6"/></g></g><text x="264" y="203" font-size="14" font-weight="600" fill="#F6EDE6">저장 파일 교체 방식 확인</text><rect x="700" y="188" width="66" height="20" rx="3" fill="#4B392E"/><text x="707" y="202" font-size="12" font-weight="700" fill="#F6EDE6">개발 버그</text><text x="810" y="203" font-size="14" font-weight="500" fill="#D6C6B9">마감 10/28</text><rect x="920" y="198" width="3" height="5" rx="0.5" fill="#D6C6B9"/><rect x="924.5" y="195" width="3" height="8" rx="0.5" fill="#D6C6B9"/><rect x="929" y="192" width="3" height="11" rx="0.5" fill="#D6C6B9"/><text x="940" y="203" font-size="14" font-weight="500" fill="#D6C6B9">높음</text><text x="1070" y="203" font-size="14" font-weight="500" fill="#D6C6B9">11/01</text><rect x="1140.5" y="186.5" width="63" height="23" rx="3" fill="none" stroke="#B09A88" stroke-width="1"/><text x="1172" y="202" font-size="12" font-weight="700" fill="#D6C6B9" text-anchor="middle">삭제</text><g transform="translate(1240 191)"><path d="M5 2L10 7L5 12" fill="none" stroke="#AB9A8D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="224" y="219" width="1040" height="1" fill="#43352B"/><g transform="translate(240 235)"><g fill="none" stroke="#8DB36B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="12" height="12" rx="2"/><path d="M4 7.4L6.2 9.6L10 4.8"/></g></g><text x="264" y="247" font-size="14" font-weight="600" fill="#F6EDE6">모니터 케이블 교체</text><rect x="700.5" y="232.5" width="41" height="19" rx="3" fill="none" stroke="#7A6252" stroke-width="1"/><text x="707" y="246" font-size="12" font-weight="700" fill="#D6C6B9">할 일</text><text x="810" y="247" font-size="14" font-weight="500" fill="#AB9A8D">마감 없음</text><rect x="920" y="242" width="3" height="5" rx="0.5" fill="#D6C6B9"/><rect x="924.5" y="239" width="3" height="8" rx="0.5" fill="#7A6252"/><rect x="929" y="236" width="3" height="11" rx="0.5" fill="#7A6252"/><text x="940" y="247" font-size="14" font-weight="500" fill="#D6C6B9">낮음</text><text x="1070" y="247" font-size="14" font-weight="500" fill="#D6C6B9">10/31</text><rect x="1140.5" y="230.5" width="63" height="23" rx="3" fill="none" stroke="#B09A88" stroke-width="1"/><text x="1172" y="246" font-size="12" font-weight="700" fill="#D6C6B9" text-anchor="middle">삭제</text><g transform="translate(1240 235)"><path d="M5 2L10 7L5 12" fill="none" stroke="#AB9A8D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="224" y="263" width="1040" height="1" fill="#43352B"/><text x="224" y="300" font-size="12" font-weight="400" fill="#AB9A8D">행(삭제 버튼 밖)을 누르면 보기 전용 상세(SCR-002)가 열림. 수정, 기록 추가, 보관 해제 버튼은 없음. 행의 삭제는 확인 단계를 거침 (AC-040)</text><text x="224" y="320" font-size="12" font-weight="400" fill="#AB9A8D">정렬: 보관한 날 최신이 위 (임시). 검색·필터는 보관한 카드만 대상</text><text x="224" y="340" font-size="12" font-weight="400" fill="#AB9A8D">조건에 맞는 카드가 없으면 이 자리에 "조건에 맞는 보관한 카드가 없습니다."와 적용 중인 조건이 나옴 (문구는 04-ui-spec.md가 우선)</text><text x="224" y="372" font-size="12" font-weight="700" fill="#AB9A8D">삭제를 누르면 그 행이 아래처럼 바뀜 (예시)</text><rect x="224.5" y="384.5" width="1039" height="43" fill="#2B221C" stroke="#43352B" stroke-width="1"/><text x="240" y="411" font-size="14" font-weight="500" fill="#F6EDE6">이 카드와 진행 기록이 삭제됩니다. 되돌릴 수 없습니다.</text><rect x="1040.5" y="392.5" width="63" height="27" rx="4" fill="none" stroke="#B09A88" stroke-width="1"/><text x="1072" y="410" font-size="14" font-weight="700" fill="#D6C6B9" text-anchor="middle">취소</text><rect x="1116" y="392" width="136" height="28" rx="4" fill="#EC8148"/><text x="1184" y="410" font-size="14" font-weight="700" fill="#1F1814" text-anchor="middle">삭제 확인</text><text x="224" y="452" font-size="12" font-weight="400" fill="#AB9A8D">삭제 확인 뒤 저장이 끝나야 행이 사라짐 (그동안 사이드바 저장 상태는 저장 중). 저장에 실패하면 행이 그대로 남고 저장 실패 알림이 뜸</text><rect x="208" y="824" width="1072" height="36" fill="#16100D"/><rect x="208" y="824" width="1072" height="1" fill="#43352B"/><text x="224" y="847" font-size="14" font-weight="400" fill="#D6C6B9">보관함 3건</text></g>
