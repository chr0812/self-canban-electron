그 날짜로 바뀜 (월·주 보기 모두, 완료 카드도)</text><text x="540" y="748" font-size="12" font-weight="400" fill="#AB9A8D">끌리는 칩은 흐리게, 놓을 수 있는 칸은 점선 윤곽. 저장이 성공해야 칩이 옮겨 가고 실패하면 제자리</text><text x="540" y="766" font-size="12" font-weight="400" fill="#AB9A8D">같은 칸이나 칸 밖에 놓으면 아무 일 없음. 키보드로는 카드 입력 화면의 마감일 칸에서 바꿈</text><g transform="translate(224 793)"><g fill="none" stroke="#D6C6B9" stroke-width="1.3" stroke-linecap="round"><ellipse cx="7" cy="8.6" rx="3.3" ry="4.4" fill="#D6C6B9" fill-opacity=".28"/><circle cx="7" cy="3.4" r="1.9"/><path d="M3.7 6.2L1 4.8M3.6 8.6H0.8M3.8 11L1.2 12.6M10.3 6.2L13 4.8M10.4 8.6H13.2M10.2 11L12.8 12.6"/></g></g><text x="244" y="805" font-size="14" font-weight="400" fill="#D6C6B9">개발 버그</text><g transform="translate(334 793)"><g fill="none" stroke="#D6C6B9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="12" height="12" rx="2"/><path d="M4 7.4L6.2 9.6L10 4.8"/></g></g><text x="354" y="805" font-size="14" font-weight="400" fill="#D6C6B9">할 일</text><g transform="translate(414 793)"><path d="M7 0.8L13.6 12.6H0.4Z" fill="#F0457A" stroke="#F0457A" stroke-width="1" stroke-linejoin="round"/><path d="M7 5L7 8.6" stroke="#1F1814" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="10.5" r="0.9" fill="#1F1814"/></g><text x="434" y="805" font-size="14" font-weight="400" fill="#D6C6B9">마감 지남</text><g transform="translate(530 793)"><g fill="none" stroke="#8DB36B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="6"/><path d="M4.2 7.2L6.2 9.2L9.8 5"/></g></g><text x="550" y="805" font-size="14" font-weight="400" fill="#D6C6B9">완료</text><text x="1264" y="805" font-size="14" font-weight="400" fill="#AB9A8D" text-anchor="end">마감일이 없는 카드 3건은 보드에서만 보입니다</text><rect x="208" y="824" width="1072" height="36" fill="#16100D"/><rect x="208" y="824" width="1072" height="1" fill="#43352B"/><text x="224" y="847" font-size="14" font-weight="400" fill="#D6C6B9">11월에 마감인 카드 11건</text></g>
</svg>
