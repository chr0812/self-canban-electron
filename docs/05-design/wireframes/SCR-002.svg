<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="ttl dsc">
<title id="ttl">SCR-002 카드 입력·상세 와이어프레임 (어두운 판으로 그림, 따뜻한 색 체계)</title>
<desc id="dsc">보드 위에 뜨는 대화상자. 왼쪽 입력 항목(마감일 칸은 날짜 선택 달력 아이콘, 우선순위는 없음 낮음 중간 높음 순), 오른쪽 진행 기록, 아래 저장과 삭제 줄, 삭제 확인 단계 모양, 새 카드 모드의 상태 선택 목록(할 일과 진행 중)을 그린 저충실도 와이어프레임. 어두운 판으로 그린 것이며 처음 열리는 기본은 밝은 판이다. 창 안쪽 1280x860 기준</desc>
<rect width="1280" height="860" fill="#1F1814"/>
